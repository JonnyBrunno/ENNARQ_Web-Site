{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login | ENNARQ</title>
    <link rel="stylesheet" href="{% static 'style_ENNARQ.css' %}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Acessar Conta</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-primary btn-submit">Entrar</button>
            </form>
            <div class="auth-footer">
                <p>Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
                <p><a href="{% url 'index' %}">Voltar para Home</a></p>
            </div>
        </div>
    </div>
</body>
</html>
